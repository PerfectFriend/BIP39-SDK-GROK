<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0618"/>
      <stop offset="55%" stop-color="#12102A"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <radialGradient id="swirl" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f4c15d" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0A0618" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#f4c15d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#void)"/>
  <circle cx="640" cy="280" r="280" fill="url(#swirl)"/>
  <!-- Van Gogh star dots -->
  <g fill="#f2efe9" opacity="0.7">
    <circle cx="120" cy="80" r="1.5"/><circle cx="200" cy="140" r="1"/><circle cx="340" cy="60" r="1.2"/>
    <circle cx="480" cy="110" r="1"/><circle cx="900" cy="90" r="1.5"/><circle cx="1040" cy="150" r="1"/>
    <circle cx="1160" cy="70" r="1.2"/><circle cx="180" cy="320" r="1"/><circle cx="1100" cy="300" r="1.3"/>
    <circle cx="60" cy="500" r="1"/><circle cx="1220" cy="480" r="1.2"/><circle cx="700" cy="50" r="1"/>
  </g>
  <!-- Gaudí mosaic arch -->
  <path d="M200 520 Q640 80 1080 520" fill="none" stroke="url(#neon)" stroke-width="6" filter="url(#glow)" opacity="0.9"/>
  <path d="M260 520 Q640 140 1020 520" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
  <!-- Mosaic tiles along arch -->
  <g opacity="0.85">
    <rect x="300" y="300" width="28" height="22" rx="3" fill="#00f0ff" transform="rotate(-25 314 311)"/>
    <rect x="380" y="230" width="26" height="20" rx="3" fill="#ff2d95" transform="rotate(-15 393 240)"/>
    <rect x="470" y="180" width="28" height="22" rx="3" fill="#f4c15d" transform="rotate(-5 484 191)"/>
    <rect x="580" y="155" width="26" height="20" rx="3" fill="#7c5cff"/>
    <rect x="680" y="160" width="28" height="22" rx="3" fill="#00f0ff" transform="rotate(8 694 171)"/>
    <rect x="780" y="195" width="26" height="20" rx="3" fill="#ff2d95" transform="rotate(18 793 205)"/>
    <rect x="870" y="260" width="28" height="22" rx="3" fill="#f4c15d" transform="rotate(28 884 271)"/>
    <rect x="940" y="340" width="26" height="20" rx="3" fill="#7c5cff" transform="rotate(35 953 350)"/>
  </g>
  <!-- Title -->
  <text x="640" y="430" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="700" fill="#f2efe9" filter="url(#glow)">BIP39 SDK</text>
  <text x="640" y="480" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#9a94b8">Cyberpunk × Van Gogh × Gaudí · Secure onboarding</text>
  <text x="640" y="560" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#00f0ff">BIP39-SDK-GROK</text>
</svg>
